name: Quantara Paper Trader

on:
  schedule:
    - cron: '0 21 * * 1-5'  # 4PM EST = 9PM UTC, weekdays only
  workflow_dispatch:  # allows manual trigger from GitHub

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run paper trader
        run: |
          python run_paper_trader.py

      - name: Commit results
        run: |
          git config --local user.email "quantara@automated.com"
          git config --local user.name "Quantara Bot"
          git add results/
          git diff --staged --quiet || git commit -m "Auto: paper trading signals $(date +'%Y-%m-%d')"
          git push