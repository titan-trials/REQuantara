name: Quantara Paper Trader

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run paper trader
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python run_paper_trader.py

      - name: Commit results
        run: |
          git config --local user.email "quantara@automated.com"
          git config --local user.name "Quantara Bot"
          git add results/
          git diff --staged --quiet || git commit -m "Auto: paper trading signals $(date +'%Y-%m-%d')"
          git push